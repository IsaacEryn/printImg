<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrintImg (HTML)</title>
<style id="page-style">
	/* 여백에 따라 JS가 다시 씀 */
	@page { size: A4 portrait; margin: 10mm; }
</style>
<style>
	/* ---------- 색·크기 토큰 ---------- */
	:root {
		--sheet-w: 190mm;   /* applyMargin()이 갱신 */
		--sheet-h: 277mm;   /* applyMargin()이 갱신 */
		--sheet-ratio: 190 / 277; /* 화면 미리보기 비율, applyMargin()이 갱신 */
		--bg: #e9e9ec;
		--panel: #fff;
		--line: #c9c9cf;
		--text: #1f1f24;
		--muted: #5a5a63;   /* 흰 배경 대비 6.5:1 */
		--accent: #1a5fb4;  /* 흰 배경 대비 6.3:1 */
		--danger: #b3261e;  /* 흰 배경 대비 5.9:1 */
		--focus: #005fcc;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		font: 15px/1.5 system-ui, "Malgun Gothic", sans-serif;
		background: var(--bg);
		color: var(--text);
	}
	h1 { font-size: 18px; margin: 0; }
	h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }

	/* 키보드 포커스: 모든 컨트롤에 굵은 링 */
	:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

	/* ---------- 레이아웃: 왼쪽 설정 패널 + 오른쪽 미리보기 ---------- */
	.app {
		display: grid;
		grid-template-columns: 1fr;
		min-height: 100vh;
	}
	@media (min-width: 900px) {
		.app { grid-template-columns: 320px minmax(0, 1fr); }
		.panel { position: sticky; top: 0; height: 100vh; overflow: auto; }
	}
	.panel {
		background: var(--panel);
		border-right: 1px solid var(--line);
		padding: 20px;
		display: flex; flex-direction: column; gap: 22px;
	}
	.panel section, .panel fieldset {
		border: 1px solid var(--line); border-radius: 8px;
		padding: 14px; margin: 0;
	}
	.panel legend { font-size: 14px; color: var(--muted); font-weight: 600; padding: 0 4px; }
	.field { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
	.field.stack { flex-direction: column; align-items: stretch; gap: 4px; }
	.field input[type=checkbox] { width: 18px; height: 18px; margin: 0; }
	.field input[type=number] { font: inherit; padding: 6px 8px; width: 6em; border: 1px solid var(--line); border-radius: 6px; }
	input[type=file] { font: inherit; max-width: 100%; }
	.hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
	button {
		font: inherit; font-weight: 600;
		padding: 10px 16px; width: 100%;
		border: 0; border-radius: 8px;
		background: var(--accent); color: #fff; cursor: pointer;
	}
	button:disabled { background: #9a9aa3; cursor: not-allowed; }
	#fileInfo { margin: 8px 0 0; word-break: break-all; }
	#status { margin: 10px 0 0; min-height: 1.5em; }
	#error { margin: 10px 0 0; color: var(--danger); font-weight: 600; }
	#error:empty { display: none; }
	kbd { font: inherit; font-size: 12px; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: #f4f4f6; }

	/* ---------- 미리보기 ---------- */
	.preview { padding: 20px 16px; min-width: 0; }
	.sheet {
		position: relative;
		width: var(--sheet-w);
		max-width: 100%;
		aspect-ratio: var(--sheet-ratio); /* 빈 상태에서도 A4 한 장 비율. 내용이 더 길면 늘어남 */
		margin: 0 auto;
		background: #fff;
		box-shadow: 0 0 8px rgba(0,0,0,.25);
	}
	.sheet:empty::after {
		content: "왼쪽에서 이미지를 선택하면 여기에 미리보기가 나타납니다.";
		display: block; padding: 40px 20px; text-align: center; color: var(--muted);
	}

	/* 이미지: 기본은 원본 크기(최대 폭 제한, 가운데 정렬), 폭 맞춤이면 100% */
	#img {
		display: block;
		max-width: 100%;
		height: auto;
		margin: 0 auto;
	}
	#img.fit { width: 100%; }

	/* 화면에서만 보이는 페이지 경계선 */
	.break {
		position: absolute; left: 0; right: 0;
		border-top: 2px dashed var(--danger);
		pointer-events: none;
	}
	.break span {
		position: absolute; right: 4px; top: -20px;
		font-size: 12px; color: var(--danger); background: rgba(255,255,255,.9); padding: 0 4px;
	}

	/* ---------- 인쇄 시 ---------- */
	@media print {
		body { background: #fff; }
		.panel, .break { display: none !important; }
		.app { display: block; min-height: 0; }
		.preview { padding: 0; }
		.sheet {
			width: auto; max-width: none; min-height: 0; aspect-ratio: auto; margin: 0;
			box-shadow: none;
		}
	}
</style>
<script>
// head에 있으므로 DOM이 준비된 뒤 실행
document.addEventListener('DOMContentLoaded', function () {
	const MM_PER_INCH = 25.4, CSS_DPI = 96;
	const A4_W_MM = 210, A4_H_MM = 297;
	const mmToPx = mm => mm / MM_PER_INCH * CSS_DPI;

	const fileInput = document.getElementById('file');
	const fitBox    = document.getElementById('fit');
	const marginIn  = document.getElementById('margin');
	const printBtn  = document.getElementById('print');
	const fileInfo  = document.getElementById('fileInfo');
	const status    = document.getElementById('status');
	const errorEl   = document.getElementById('error');
	const sheet     = document.getElementById('sheet');
	const pageStyle = document.getElementById('page-style');

	let img = null;      // 현재 <img>
	let fileName = '';
	let loadSeq = 0;     // 파일 선택 순번. 늦게 끝난 이전 로드를 무시하는 데 씀

	// 여백(mm)을 0~30으로 정리해서 돌려줌
	function marginMm() {
		let m = parseFloat(marginIn.value);
		if (!Number.isFinite(m)) m = 10;
		return Math.min(30, Math.max(0, m));
	}

	// 여백을 @page 규칙과 화면 미리보기 크기에 반영
	function applyMargin() {
		const m = marginMm();
		pageStyle.textContent = `@page { size: A4 portrait; margin: ${m}mm; }`;
		document.documentElement.style.setProperty('--sheet-w', `${A4_W_MM - 2 * m}mm`);
		document.documentElement.style.setProperty('--sheet-h', `${A4_H_MM - 2 * m}mm`);
		document.documentElement.style.setProperty('--sheet-ratio', `${A4_W_MM - 2 * m} / ${A4_H_MM - 2 * m}`);
		return m;
	}

	// 인쇄 폭에서의 예상 페이지 수와, 이미지 높이 대비 한 페이지 높이 비율
	function layout(naturalW, naturalH, fit, m) {
		const sheetW = mmToPx(A4_W_MM - 2 * m);
		const sheetH = mmToPx(A4_H_MM - 2 * m);
		const w = fit ? sheetW : Math.min(naturalW, sheetW);
		const h = naturalH * (w / naturalW);
		return { pages: Math.max(1, Math.ceil(h / sheetH)), pageFrac: sheetH / h };
	}

	function render() {
		const m = applyMargin();
		if (!img) return;
		img.classList.toggle('fit', fitBox.checked);

		const { pages, pageFrac } = layout(img.naturalWidth, img.naturalHeight, fitBox.checked, m);

		// 기존 경계선 제거 후 다시 그림
		sheet.querySelectorAll('.break').forEach(el => el.remove());
		for (let i = 1; i < pages; i++) {
			const line = document.createElement('div');
			line.className = 'break';
			line.setAttribute('aria-hidden', 'true');
			line.style.top = `${i * pageFrac * 100}%`; // 화면 축소에도 따라오도록 비율로
			line.innerHTML = `<span>${i} / ${pages} 페이지 끝</span>`;
			sheet.appendChild(line);
		}

		status.textContent = `여백 ${m}mm · 예상 ${pages}페이지`;
		printBtn.disabled = false;
	}

	fileInput.addEventListener('change', () => {
		const file = fileInput.files[0];
		fileInput.value = ''; // 같은 파일을 다시 골라도 change가 나도록 비움
		if (!file) return;

		const seq = ++loadSeq;
		const url = URL.createObjectURL(file);
		fileName = file.name;
		fileInfo.textContent = `${file.name} · 불러오는 중…`;
		errorEl.textContent = '';

		const el = document.createElement('img');
		el.id = 'img';
		el.alt = file.name;
		el.onload = () => {
			URL.revokeObjectURL(url);
			if (seq !== loadSeq) return; // 그 사이 다른 파일을 골랐으면 무시
			img = el;
			sheet.replaceChildren(el);
			fileInfo.textContent = `${file.name} · ${el.naturalWidth} × ${el.naturalHeight} px`;
			render();
		};
		el.onerror = () => {
			URL.revokeObjectURL(url);
			if (seq !== loadSeq) return;
			img = null;
			sheet.replaceChildren();
			printBtn.disabled = true;
			fileInfo.textContent = file.name;
			status.textContent = '';
			errorEl.textContent = `이미지를 열 수 없습니다: ${file.name}`;
		};
		el.src = url;
	});

	fitBox.addEventListener('change', render);
	marginIn.addEventListener('input', render);
	marginIn.addEventListener('change', () => { marginIn.value = marginMm(); render(); });
	printBtn.addEventListener('click', () => window.print());
	applyMargin();
});
</script>
</head>
<body>

<div class="app">
	<aside class="panel" aria-label="설정">
		<h1>PrintImg <span class="hint" style="display:inline">이미지를 A4로 나눠 인쇄</span></h1>

		<section aria-labelledby="h-file">
			<h2 id="h-file">1. 이미지 선택</h2>
			<label for="file" class="hint" style="margin:0 0 6px">PNG, JPG, BMP, GIF, WEBP</label>
			<input type="file" id="file" accept="image/png,image/jpeg,image/bmp,image/gif,image/webp">
			<p id="fileInfo" aria-live="polite">선택된 파일 없음</p>
		</section>

		<fieldset>
			<legend>2. 옵션</legend>
			<div class="field">
				<input type="checkbox" id="fit">
				<label for="fit">폭 맞춤 (작은 이미지도 A4 폭까지 확대)</label>
			</div>
			<div class="field stack">
				<label for="margin">여백 (mm)</label>
				<input type="number" id="margin" min="0" max="30" step="1" value="10" inputmode="numeric" aria-describedby="margin-hint">
				<span id="margin-hint" class="hint">0~30 사이. 네 변 동일.</span>
			</div>
		</fieldset>

		<section aria-labelledby="h-print">
			<h2 id="h-print">3. 인쇄</h2>
			<button type="button" id="print" disabled>인쇄</button>
			<p class="hint"><kbd>Ctrl</kbd>+<kbd>P</kbd>로도 인쇄할 수 있습니다.</p>
			<p id="status" role="status" aria-live="polite"></p>
			<p id="error" role="alert"></p>
			<p class="hint">인쇄 대화상자에서 여백은 <strong>기본값</strong>, 배율은 <strong>100%</strong>로 두고, <strong>머리글과 바닥글</strong>은 끄세요. 바꾸면 페이지가 어긋납니다. 페이지 경계선은 예상 위치입니다.</p>
		</section>
	</aside>

	<main class="preview" aria-label="미리보기">
		<div class="sheet" id="sheet"></div>
	</main>
</div>

</body>
</html>
