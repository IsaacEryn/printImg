# Windows exe를 GitHub의 Windows 러너에서 빌드한다. 태그(v*)를 push하면 그 릴리스에 exe를 붙이고,
# 수동 실행(workflow_dispatch)이면 아티팩트로만 남긴다.
name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python -m PyInstaller PrintImg.spec --noconfirm
      - name: Rename
        shell: bash
        run: |
          ver=$(sed -n "s/.*StringStruct('ProductVersion', '\([^']*\)').*/\1/p" version_info.txt)
          cp dist/PrintImg.exe "dist/PrintImg-${ver}-win.exe"
          echo "ver=$ver" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: PrintImg-${{ env.ver }}-win
          path: dist/PrintImg-${{ env.ver }}-win.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "dist/PrintImg-${ver}-win.exe" --clobber
